<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="overlay">

<div class="login-box">

<h1>♻ Smart Waste</h1>

<h3>Login to Continue</h3>

<form method="POST">

<input type="text"
       name="username"
       placeholder="Username"
       required>

<input type="password"
       name="password"
       placeholder="Password"
       required>

<button type="submit">

Login

</button>

</form>

<p>

Don't have an account?

<a href="/register">

Register

</a>

</p>

</div>

</div>

</body>

</html>
